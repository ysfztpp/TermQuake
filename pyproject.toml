[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "termquake"
version = "0.1.0"
description = "Data pipeline for the TermQuake disaster-relief termbase: Google Sheet -> SQLite -> exports, TBX and web app data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
termquake = "termquake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Line length is the formatter's job (ruff format); long SQL/messages are fine.
ignore = ["E501"]
