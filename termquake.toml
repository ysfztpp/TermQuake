# TermQuake configuration.

# The languages are rows of the `language` table (data/db/language.sql).
# Website and downloads show every language that has at least one term.

# ---------------------------------------------------------------------------
# The original Google Sheet. Used only to create data/db from the snapshot in
# data/legacy (`termquake import-sheet`) and to download a copy of a sheet
# (`termquake fetch-sheet`). Normal work never touches it: data/db is the
# source of truth.
# ---------------------------------------------------------------------------
[sheet]
id = "1LfFJZxpbCbz2lRpKQ0_kTMKNJVDJ9FyrlAoP15TU8wU"

# Sheet tab -> snapshot file in data/legacy/
[sheet.tabs]
"All Terms and Expressions /Terimler ve İfadeler" = "terms"
"Terms Needing Definition Selection" = "definitions"
"Source Term Selection" = "term_candidates"
"Term submission" = "term_submissions"

# Value of the sheet's "Domain" column -> domain code (data/db/domain.sql).
[sheet.domains]
"Genel Terimler / General Terms" = "general"
"Arama Kurtarma / Search & Rescue" = "search_rescue"
"İlk Yardım / Fırst Aid" = "first_aid"
"Tıbbi Terimler / Medical Terms" = "medical"
"Diğer / Misc" = "misc"
"İfadeler / Expressions" = "expressions"
