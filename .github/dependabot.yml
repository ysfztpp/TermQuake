# Monthly, grouped dependency update pull requests. CI must pass before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
