# Checks the data and the pipeline (the same checks as CI), builds the
# database, the downloads and the web app, tests the result in a real browser
# (including offline), then deploys to GitHub Pages. Nothing is published if
# any step fails.
#
# First run in a new repository: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "data/db/**"
      - "db/**"
      - "src/**"
      - "site/**"
      - "tests/e2e/**"
      - "termquake.toml"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the "data updated" date comes from the history of data/db
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,e2e]"
      - name: Pipeline tests
        run: pytest
      - name: Build the database from data/db
        run: termquake build
      - name: Data files are in canonical form
        run: termquake dump --check
      - name: Downloads and web app data
        run: termquake export

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build web app
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Browser tests (search, show mode, deep links, offline)
        run: |
          python -m playwright install --with-deps chromium
          (cd site && npx vite preview --port 4173 --strictPort --base "$BASE_PATH" &)
          for i in $(seq 60); do curl -sf "http://localhost:4173$BASE_PATH" > /dev/null && break; sleep 1; done
          E2E_URL="http://localhost:4173$BASE_PATH" pytest tests/e2e

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
