# Publishing a citable dataset version: push a tag like data-v1.0.0 and this
# attaches the database, TBX and CSV to a GitHub Release.
# (Connect the repository to Zenodo once, and every release also gets a DOI.)
name: Data release

on:
  push:
    tags: ["data-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install .
      - run: termquake all
      - run: termquake dump --check
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "TermQuake data ${TAG#data-}" \
            --notes "TermQuake data ${TAG#data-}: the SQLite database, TBX-Basic and CSV." \
            site/public/downloads/termquake.db \
            site/public/downloads/termquake.tbx \
            site/public/downloads/termquake.csv
